name: MoonStretch checks

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verification:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.16+b1a0e846e"
          core-version: "0.10.16+b1a0e846e"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install independent SoundTouch reference
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y soundstretch
          dpkg-query -W soundstretch libsoundtouch1
      - run: moon update
      - name: Full Linux verification with independent reference
        if: runner.os == 'Linux'
        run: python scripts/verify.py --profile full --targets js wasm wasm-gc native --soundstretch soundstretch
      - name: Full Windows verification
        if: runner.os == 'Windows'
        run: python scripts/verify.py --profile full --targets js native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: |
            work/verification/*/*.json
            work/verification/*/*.log
          if-no-files-found: warn

  published-package:
    name: Install public Mooncakes package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.16+b1a0e846e"
          core-version: "0.10.16+b1a0e846e"
      - run: python scripts/verify.py --profile release --version "${GITHUB_REF_NAME#v}" --targets js wasm wasm-gc native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-package-verification
          path: |
            work/verification/*/summary.json
            work/verification/*/*.log
