name: MoonStretch checks

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  runtime:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.16+b1a0e846e"
          core-version: "0.10.16+b1a0e846e"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --release --deny-warn
      - run: moon run --target ${{ matrix.target }} examples/basic

  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.16+b1a0e846e"
          core-version: "0.10.16+b1a0e846e"
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target == 'native'
        with:
          arch: x64
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --release --deny-warn
      - run: moon run --target ${{ matrix.target }} examples/basic
      - uses: actions/setup-python@v5
        if: matrix.target == 'js'
        with:
          python-version: "3.12"
      - name: Independent PCM measurements
        if: matrix.target == 'js'
        run: python scripts/audio_quality.py --output work/quality-windows.json -- node scripts/quality_driver.mjs
      - name: WAV format and command-line interoperability
        if: matrix.target == 'js'
        run: node scripts/verify_wav.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'js'
        with:
          name: quality-windows
          path: work/quality-windows.json

  audio-quality:
    name: Independent audio properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.16+b1a0e846e"
          core-version: "0.10.16+b1a0e846e"
      - name: Install the independent SoundTouch command-line reference
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y soundstretch
          dpkg-query -W soundstretch libsoundtouch1
      - run: moon update
      - run: moon build --target js --release --deny-warn
      - name: WAV format and command-line interoperability
        run: node scripts/verify_wav.mjs
      - name: Measure duration, pitch, channels, streaming and alias rejection
        run: python scripts/audio_quality.py --soundstretch soundstretch --output work/quality-linux.json -- node scripts/quality_driver.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quality-linux
          path: work/quality-linux.json

  published-package:
    name: Install public Mooncakes package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: "0.10.16+b1a0e846e"
          core-version: "0.10.16+b1a0e846e"
      - run: python scripts/verify_release.py --targets js wasm wasm-gc native
